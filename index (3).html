<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--panel:#141416;--panel2:#1c1c1f;--line:#2b2b30;--ink:#f6f6f7;--muted:#9b9ba3;--accent:#ff6a1a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;background:radial-gradient(800px 380px at 50% -140px,rgba(255,106,26,.24),transparent 70%) no-repeat,var(--bg);padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.logo{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,106,26,.5)}
.top h1{font-size:1.25rem;line-height:1.1;margin:0;font-weight:700;letter-spacing:.06em}
.top h1 span{color:var(--accent)}
.tag{margin:3px 0 0;color:var(--muted);font-size:.8rem}
.pill{margin-left:auto;font-size:.72rem;font-weight:700;letter-spacing:.08em;padding:5px 10px;border-radius:99px;border:1px solid var(--accent);color:var(--accent)}
h2.hero{font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
p.sub{margin:0 0 22px;color:var(--muted);font-size:1rem}
.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 20px 50px -25px rgba(0,0,0,.8)}
.lbl{display:block;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.box .lbl:first-child{margin-top:0}
textarea{width:100%;min-height:104px;padding:14px;border:1px solid var(--line);border-radius:14px;outline:0;resize:vertical;background:var(--panel2);color:var(--ink);font:inherit;font-size:1rem;line-height:1.45}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:#6c6c74}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.8rem;color:var(--muted)}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lnk{border:0;background:none;color:var(--accent);padding:8px 0;font-weight:500;font-size:.85rem}
.seg{display:flex;gap:6px;background:var(--panel2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:10px 6px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--accent);color:#0a0a0b;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:8px 14px;font-size:.85rem;color:var(--muted)}
.chips button.on{border-color:var(--accent);color:var(--ink);background:rgba(255,106,26,.14)}
#go{width:100%;margin-top:20px;padding:16px;border:0;border-radius:14px;background:var(--accent);color:#0a0a0b;font-weight:700;font-size:1.05rem}
#go:hover:not(:disabled){filter:brightness(1.08)}
#go:disabled{opacity:.6;cursor:wait}
#out{margin-top:22px}
.frame{position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--panel);aspect-ratio:var(--ar,1/1)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame.crop img#img{position:absolute;top:0;left:0;width:100%;height:auto}
.frame img.wm{position:absolute;right:2.5%;bottom:2.5%;left:auto;top:auto;width:8%;height:auto;aspect-ratio:1/1;border-radius:50%;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.load{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);background:linear-gradient(110deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);background-size:200% 100%;animation:sh 1.6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.load,.spin{animation-duration:3s}}
.acts{display:flex;gap:10px;margin-top:12px}
.acts button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.acts #dl{background:var(--accent);border-color:var(--accent);color:#0a0a0b}
.err{color:#ff8a4d;font-weight:500}
.dbg{margin:8px 0 0;font-size:.8rem;color:var(--muted)}
#galwrap{margin-top:34px}
#galwrap h3{font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gal button{padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:1/1;background:var(--panel)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
footer{margin-top:34px;font-size:.8rem;color:var(--muted);text-align:center}
.hide{display:none!important}

html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,textarea{touch-action:manipulation}
textarea{font-size:16px}
.seg button,.chips button,.acts button,.lnk{min-height:44px}
.chips button{padding:8px 16px}
#go{min-height:52px}
@media(max-width:360px){.gal{grid-template-columns:repeat(3,1fr)}.seg button{font-size:.88rem;padding:10px 2px}.pill{display:none}}
@media(min-width:700px){body{padding-top:40px}.gal{grid-template-columns:repeat(6,1fr)}}
</style>
</head>

<script>
const $ = id => document.getElementById(id);
let lastUrl = "";

const SOURCES = [
  { base: "https://image.pollinations.ai/prompt/", model: "flux" },
  { base: "https://image.pollinations.ai/prompt/", model: "turbo" },
  { base: "https://pollinations.ai/p/", model: "flux" }
];
const HORDE = "https://aihorde.net/api/v2";
const CROP = 0.08; // bottom strip hidden to remove the source watermark

const sleep = ms => new Promise(r => setTimeout(r, ms));

function withTimeout(promise, ms) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error("timeout")), ms);
    promise.then(v => { clearTimeout(t); resolve(v); }, e => { clearTimeout(t); reject(e); });
  });
}

function loadImg(url, ms) {
  return withTimeout(new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(url);
    i.onerror = () => reject(new Error("load"));
    i.src = url;
  }), ms);
}

function srcUrl(src, text, w, h) {
  const seed = Math.floor(Math.random() * 1e9);
  return src.base + encodeURIComponent(text) +
    "?width=" + w + "&height=" + h + "&seed=" + seed + "&model=" + src.model +
    "&nologo=true&enhance=true&referrer=ahvisuals";
}

// AI Horde: free, no sign-in, community-run. Slower when busy.
async function viaHorde(text, w, h, alive, onStatus) {
  const hw = w === h ? 512 : (h > w ? 512 : 768);
  const hh = w === h ? 512 : (h > w ? 768 : 512);
  const headers = { "Content-Type": "application/json", "apikey": "0000000000", "Client-Agent": "ahvisuals:1.1:anointedhub" };
  const res = await withTimeout(fetch(HORDE + "/generate/async", {
    method: "POST", headers,
    body: JSON.stringify({ prompt: text + ", highly detailed, sharp focus, professional quality ### blurry, low quality, distorted, watermark, text", params: { width: hw, height: hh, steps: 25, n: 1 }, nsfw: false, censor_nsfw: true, r2: true })
  }), 20000);
  if (!res.ok) throw new Error("horde " + res.status);
  const { id } = await res.json();
  if (!id) throw new Error("horde no id");
  const start = Date.now();
  while (Date.now() - start < 240000) {
    if (!alive()) { fetch(HORDE + "/generate/status/" + id, { method: "DELETE", headers }).catch(() => {}); throw new Error("cancelled"); }
    await sleep(3000);
    let d;
    try { const r = await fetch(HORDE + "/generate/status/" + id); if (!r.ok) continue; d = await r.json(); } catch (e) { continue; }
    if (d.faulted) throw new Error("horde faulted");
    onStatus(d);
    if (d.done && d.generations && d.generations[0] && d.generations[0].img) {
      const img = d.generations[0].img;
      return /^https?:/.test(img) ? await loadImg(img, 30000) : "data:image/webp;base64," + img;
    }
  }
  fetch(HORDE + "/generate/status/" + id, { method: "DELETE", headers }).catch(() => {});
  throw new Error("horde timeout");
}

let blockedByPreview = false;
document.addEventListener("securitypolicyviolation", e => {
  if (/^(img|connect|script)-src/.test(e.effectiveDirective || "") && !/^(data|blob):/.test(e.blockedURI || "")) blockedByPreview = true;
});

function showBlocked() {
  $("load").classList.add("hide");
  $("err").textContent = "This preview blocks outside connections, so images can't be made here. Upload this page to a website (GitHub Pages or Netlify) and it will work.";
  $("err").classList.remove("hide");
  done();
}

let job = 0, lastCrop = false;

async function generate() {
  const prompt = $("prompt").value.trim();
  if (!prompt) { $("prompt").focus(); return; }
  if ($("go").disabled) return;
  const my = ++job;
  const style = $("style").value;
  const [w, h] = $("size").value.split("x");
  const text = style ? prompt + ", " + style : prompt;
  const fails = [];

  $("out").classList.remove("hide");
  $("frame").classList.remove("crop");
  $("frame").style.setProperty("--ar", w + " / " + h);
  $("load").classList.remove("hide");
  $("img").classList.add("hide");
  $("wm").classList.add("hide");
  $("acts").classList.add("hide");
  $("err").classList.add("hide");
  $("dbg").classList.add("hide");
  $("go").disabled = true;
  $("go").textContent = "Generating...";
  $("stat").textContent = "Making your image...";
  $("out").scrollIntoView({ behavior: "smooth", block: "start" });

  // 1. Fast services
  for (const src of SOURCES) {
    if (my !== job) return;
    try {
      const url = await loadImg(srcUrl(src, text, w, h), 25000);
      job++;
      display(url, w, h, prompt, true, true);
      return;
    } catch (e) {
      fails.push(new URL(src.base).host + " " + src.model);
      if (blockedByPreview) { showBlocked(); return; }
    }
  }

  // 2. Free community queue (no sign-in, no pop-ups)
  if (my !== job) return;
  $("stat").textContent = "Fast services are busy. Joining the free community queue. This can take a minute or two...";
  try {
    const url = await viaHorde(text, w, h, () => my === job, d => {
      if (my !== job) return;
      const pos = d.queue_position > 0 ? " Place in line: " + d.queue_position + "." : "";
      $("stat").textContent = "Free community queue." + pos + " This can take a minute or two...";
    });
    if (my !== job) return;
    job++;
    display(url, w, h, prompt, true, false);
    return;
  } catch (e) { if (my !== job) return; fails.push("community queue"); }

  // 3. Nothing answered
  $("load").classList.add("hide");
  $("err").textContent = "The free services are busy right now. Wait a minute and try again.";
  $("err").classList.remove("hide");
  $("dbg").textContent = "Tried: " + fails.join(", ");
  $("dbg").classList.remove("hide");
  done();
}

function display(url, w, h, prompt, isNew, crop) {
  lastUrl = url;
  lastCrop = !!crop;
  $("out").classList.remove("hide");
  $("frame").classList.toggle("crop", !!crop);
  $("frame").style.setProperty("--ar", crop ? w + " / " + (h * (1 - CROP)) : w + " / " + h);
  $("err").classList.add("hide");
  $("dbg").classList.add("hide");
  $("load").classList.add("hide");
  $("img").src = url;
  $("img").classList.remove("hide");
  $("wm").classList.remove("hide");
  $("acts").classList.remove("hide");
  if (isNew && /^https?:/.test(url)) saveHist({ url, w, h, prompt, crop: !!crop });
  done();
}

function done() {
  $("go").disabled = false;
  $("go").textContent = "Generate image";
}

async function download() {
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.crossOrigin = "anonymous";
      i.onload = () => res(i);
      i.onerror = rej;
      i.src = lastUrl;
    });
    const W = img.naturalWidth;
    const H = Math.round(img.naturalHeight * (lastCrop ? 1 - CROP : 1));
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const g = c.getContext("2d");
    g.drawImage(img, 0, 0, W, H, 0, 0, W, H);
    const size = Math.round(W * 0.08), m = Math.round(W * 0.025);
    g.save();
    g.beginPath();
    g.arc(W - m - size / 2, H - m - size / 2, size / 2, 0, Math.PI * 2);
    g.clip();
    g.drawImage($("wm"), W - m - size, H - m - size, size, size);
    g.restore();
    const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("blob")), "image/png"));
    const file = new File([blob], "ah-visuals.png", { type: "image/png" });
    if (matchMedia("(pointer:coarse)").matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "AH VISUALS" }); return; }
      catch (err) { if (err && err.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ah-visuals.png";
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) {
    window.open(lastUrl, "_blank");
  }
}

const KEY = "ah-visuals-history";
function loadHist() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
}
function saveHist(item) {
  const list = [item, ...loadHist().filter(x => x.url !== item.url)].slice(0, 12);
  try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  renderHist(list);
}
function renderHist(list) {
  const g = $("gal");
  g.innerHTML = "";
  list.forEach(item => {
    const b = document.createElement("button");
    b.title = item.prompt;
    const i = document.createElement("img");
    i.src = item.url; i.alt = item.prompt; i.loading = "lazy";
    b.appendChild(i);
    b.onclick = () => { $("prompt").value = item.prompt; display(item.url, item.w, item.h, item.prompt, false, item.crop); };
    g.appendChild(b);
  });
  $("galwrap").classList.toggle("hide", list.length === 0);
}
$("clr").onclick = () => {
  try { localStorage.removeItem(KEY); } catch (e) {}
  renderHist([]);
};
renderHist(loadHist());

  "An astronaut drinking tea inside an abandoned greenhouse",
  "A giant whale swimming through a city of glass towers",
  "A cozy cabin in a snowstorm with one glowing window",
  "A market full of impossible fruit in a desert oasis",
  "A vintage sports car racing across a neon salt flat"
];
$("rnd").onclick = () => {
  $("prompt").value = IDEAS[Math.floor(Math.random() * IDEAS.length)];
  $("cnt").textContent = $("prompt").value.length + "/500";
  generate();
};

function pick(boxId, inputId) {
  $(boxId).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    $(boxId).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    $(inputId).value = b.dataset.v;
  });
}
pick("sizeSeg", "size"); pick("styleChips", "style");
$("prompt").addEventListener("input", () => { $("cnt").textContent = $("prompt").value.length + "/500"; });
$("go").onclick = generate;
$("again").onclick = generate;
$("dl").onclick = download;
$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) generate();
});
